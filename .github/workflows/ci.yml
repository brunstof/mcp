name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check src/ scripts/populate_geography.py

      - name: Ruff format check
        run: uv run ruff format --check src/

      - name: mypy
        run: uv run mypy src/

  test:
    name: Tests (MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["11.8"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: rootpassword123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # The server reads connection config from these at import time.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: rootpassword123
      MCP_READ_ONLY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        # Vector-store tests require an embedding provider (API key / model
        # download) and are not run in CI. test_embedding_service.py is also
        # excluded for the same reason. Both run locally — see README.
        run: >-
          uv run pytest
          src/tests/test_mcp_server.py
          src/tests/test_list_databases_unittest.py
          src/tests/test_execute_query_unit.py
          -k "not vector"
          --cov=src --cov-report=term-missing -v
